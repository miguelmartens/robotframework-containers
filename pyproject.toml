[project]
name = "robotframework-containers"
# Deliberately fixed. This is not a published Python package, and uv records
# the project's version in uv.lock -- so letting a release bump it here would
# desync the lockfile and fail `uv lock --check` on every release PR.
# The version that matters is the git tag, which Release Please maintains in
# version.txt, .release-please-manifest.json and CHANGELOG.md.
version = "0.0.0"
description = "Container images for running Robot Framework test suites."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"

# The project itself ships no Python distribution; the images are the artefact.
# Everything the images contain lives in the dependency groups below, one per
# image variant. `uv sync --group <variant>` builds that variant's virtualenv.
dependencies = []

[dependency-groups]

# Libraries shared by every variant. No browser drivers, no Selenium, no
# Playwright -- those belong to the variant that needs them.
base = [
  "robotframework==7.5",
  "robotframework-pabot==5.2.2",
  "robotframework-requests==0.9.7",
  "robotframework-jsonlibrary==0.5",
  # Deliberately without the [xls] extra: it pulls pandas and numpy, which
  # measured 141 MB of a 277 MB virtualenv -- more than half the image, to read
  # spreadsheets. CSV data-driven tests work without it. See the README for how
  # to add Excel support back in a derived image.
  "robotframework-datadriver==1.11.2",
  "robotframework-datetime-tz==1.0.6",
  "robotframework-faker==6.0.0",
  "robotframework-sshlibrary==3.8.0",
  "robotframework-databaselibrary==2.4.1",
  "robotframework-imaplibrary2==0.4.11",
  "robotframework-ftplibrary==1.9",
  # Linter and formatter in one package since Robocop 6 absorbed Robotidy.
  # Upstream issue #511 asked for rflint, which is dead at 1.1.
  "robotframework-robocop==9.0.0",
]

# The [bb] extra pulls robotframework-browser-batteries, which ships a
# precompiled Node runtime and the Node-side dependencies as wheels. That keeps
# nodejs and npm out of the image entirely.
browser = [
  { include-group = "base" },
  "robotframework-browser[bb]==20.4.0",
]

selenium = [
  { include-group = "base" },
  "robotframework-seleniumlibrary==6.9.0",
]

# Tooling for working on this repository, not shipped in any image.
dev = [
  "ruff==0.15.4",
]

[tool.uv]
# The images are the artefact; there is no Python distribution to build here.
package = false

# Note: pinning the interpreter belongs in the Dockerfile, not here. The image
# builds must use Debian's python3 so the venv stays valid when it is copied
# into a runtime stage, and `builder-common` sets UV_PYTHON=/usr/bin/python3
# and UV_PYTHON_DOWNLOADS=never to enforce that. Setting python-downloads here
# would apply everywhere -- including CI runners and contributor machines that
# have no system Python >= 3.13 -- and simply fail.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.robocop.lint]
# Every suite here carries suite-level documentation and the test names read as
# full sentences, so a per-test [Documentation] would only restate the name.
ignore = ["DOC02"]
