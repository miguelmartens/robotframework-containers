name: Publish

# Reusable. Called by release-please.yml once a release is cut.
#
# This is a separate workflow on purpose: tags pushed by GITHUB_TOKEN do not
# trigger other workflows, so a `on: push: tags` publish would silently never
# run for a Release Please tag. Calling it directly sidesteps that without
# needing a personal access token.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to build from.
        required: true
        type: string
      version:
        description: Release version, without the leading v.
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # `selenium` joins this list in phase 2.
        variant: [base, browser]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          # Immutable, fully-qualified tags first. Upstream republished 4.0.0
          # with different contents and broke people (#423); a full version
          # here is never re-pushed.
          #
          # The suffix is per-tag, not a global flavor: a global one also
          # applies to the raw variant tag and yields `browser-browser`.
          tags: |
            type=raw,value=${{ inputs.version }},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}},value=${{ inputs.version }},suffix=-${{ matrix.variant }}
            type=sha,format=long,suffix=-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=${{ matrix.variant }}-amd64
            type=gha,scope=${{ matrix.variant }}-arm64
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
