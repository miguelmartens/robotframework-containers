name: PR title

# Feature branches are squash-merged into develop, so the PR title becomes the
# commit message on develop -- and that is what Release Please reads to work out
# the next version. A non-conventional title would silently drop the change from
# the changelog and the version bump.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in step with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            build
            deps
            docs
            ci
            chore
            refactor
            test
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid: start it lowercase and leave off
            the trailing full stop. For example: "fix: keep quoted values in
            ROBOT_OPTIONS".
