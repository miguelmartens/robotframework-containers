name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Monthly drift check. Rebuilds from the current source and re-runs the CVE
  # gate, so a vulnerability published against the shipped image surfaces as a
  # failed scheduled run rather than sitting there unnoticed. Publishing happens
  # only from a release, so the fix ships as a patch release.
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Formatting (Prettier + Ruff)
        run: make format-check

      - name: Lint YAML
        run: pipx run yamllint .

      - name: Lint the entrypoint
        run: uvx ruff@0.15.4 check src/entrypoint/rf-entrypoint

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint the bundled suites
        run: |
          uv sync --locked --no-default-groups --group base
          uv run robocop check tests/

  build-test:
    needs: lint
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `selenium` joins this list in phase 2.
        variant: [base, browser]
        # Block style, not flow mappings: Prettier writes `{ a: b }` with spaces
        # inside the braces and yamllint's `braces` rule rejects exactly that.
        # Avoiding flow mappings keeps both tools happy without disabling a rule.
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          # Native arm64. GitHub's arm64 runners are free for public repos, so
          # there is no excuse for shipping an untested arm64 image the way
          # upstream does.
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant }} (${{ matrix.platform.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: rfc:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform.arch }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            REVISION=${{ github.sha }}

      # The image runs as uid 1000, gid 0 and never chowns a directory you
      # mounted (ppodgorsek #403). So the host side has to opt in, exactly as the
      # README tells users to: group 0 and group-writable. Doing it once here
      # keeps every run step below free of permission scaffolding.
      - name: Prepare the report directories
        run: |
          mkdir -p reports reports-uid reports-opts reports-cmd reports-ro reports-pabot
          sudo chgrp -R 0 reports reports-uid reports-opts reports-cmd reports-ro reports-pabot
          chmod -R g+w reports reports-uid reports-opts reports-cmd reports-ro reports-pabot

      - name: Report image size
        run: |
          size=$(docker image inspect rfc:${{ matrix.variant }} --format '{{.Size}}')
          echo "### ${{ matrix.variant }} / ${{ matrix.platform.arch }}: $((size / 1024 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Serve the test site
        if: matrix.variant == 'browser'
        run: |
          python3 -m http.server 8000 --directory tests/site &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done

      # Deliberately no --shm-size=1g anywhere in this job. Upstream passes it
      # in every one of its own CI steps, which concedes the image is unusable
      # at the default /dev/shm.
      - name: Run the base suite
        run: |
          docker run --rm \
            -v "$PWD/tests/base:/opt/robotframework/tests:ro" \
            -v "$PWD/reports:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }}

      - name: Run the browser suite
        if: matrix.variant == 'browser'
        run: |
          docker run --rm --network host \
            -e SITE_URL=http://127.0.0.1:8000 \
            -e ROBOT_TEST_RUN_ID=browser \
            -v "$PWD/tests/browser:/opt/robotframework/tests:ro" \
            -v "$PWD/reports:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }}

      - name: Regression -- arbitrary UID with GID 0 (ppodgorsek #425, #420, #424)
        run: |
          docker run --rm --user 4711:0 \
            -v "$PWD/tests/base:/opt/robotframework/tests:ro" \
            -v "$PWD/reports-uid:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }}

      - name: Regression -- ROBOT_OPTIONS keeps spaces (ppodgorsek #194)
        run: |
          docker run --rm \
            -e ROBOT_OPTIONS='--variable "SPACED:value with spaces"' \
            -v "$PWD/tests/regression:/opt/robotframework/tests:ro" \
            -v "$PWD/reports-opts:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }}

      - name: Regression -- a caller-supplied command still gets setup (#489, #509)
        run: |
          docker run --rm \
            -v "$PWD/reports-cmd:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }} \
            sh -c 'test -d /opt/robotframework/reports && test -w "$HOME" && echo setup-ok'

      - name: Regression -- read-only root filesystem
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/tests/base:/opt/robotframework/tests:ro" \
            -v "$PWD/reports-ro:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }}

      - name: Regression -- parallel execution via pabot
        run: |
          docker run --rm \
            -e ROBOT_THREADS=2 \
            -v "$PWD/tests/base:/opt/robotframework/tests:ro" \
            -v "$PWD/reports-pabot:/opt/robotframework/reports" \
            rfc:${{ matrix.variant }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rfc:${{ matrix.variant }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # Podman resolves Containerfile/.containerignore (symlinks to the Docker
  # names) and Buildah handles the BuildKit cache mounts natively. Without this
  # job the Podman path would rot silently.
  podman:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build with Podman
        run: podman build --target base -t rfc:base .

      # Under rootless Podman the container's uid lands on a subuid, so the
      # host directory has to be writable by it. 0777 is the blunt instrument
      # that works regardless of how the host's subuid ranges are configured.
      #
      # Users who want the reports back owned by themselves should use
      # `--userns=keep-id:uid=1000,gid=0`; see the README. That is deliberately
      # not asserted here, because it depends on the host's /etc/subuid setup
      # rather than on anything this image does.
      - name: Run the base suite, rootless
        run: |
          mkdir -p reports && chmod 0777 reports
          podman run --rm \
            -v "$PWD/tests/base:/opt/robotframework/tests:ro,z" \
            -v "$PWD/reports:/opt/robotframework/reports:z" \
            rfc:base

      - name: Run hardened, with an arbitrary UID
        run: |
          mkdir -p reports-hardened && chmod 0777 reports-hardened
          podman run --rm --user 4711:0 \
            --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/tests/base:/opt/robotframework/tests:ro,z" \
            -v "$PWD/reports-hardened:/opt/robotframework/reports:z" \
            rfc:base

      - name: The suite really produced a report
        run: test -s reports/output.xml

  # One required status check for branch protection. Matrix leg names change
  # whenever the matrix does; this does not.
  ci:
    if: always()
    needs: [lint, build-test, podman]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if anything upstream did not succeed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "build-test=${{ needs.build-test.result }}"
          echo "podman=${{ needs.podman.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.build-test.result }}" = "success" ] \
            && [ "${{ needs.podman.result }}" = "success" ]
